# Instâncias de Estoque no servidor (2026-10-21) — todas com o mesmo código
# (APP_MODULOS=estoque), cada uma com pasta, usuário, banco (dados/), .env,
# porta, serviço systemd e site no Caddy próprios. Lido por
# scripts/instalar-instancia-estoque.sh e scripts/deploy.sh.
#
# Pasta: /opt/estoque-<slug>   Serviço: estoque-<slug>
# Endereço: https://<nome_dns> (porta 443, mesmo Caddy da Central) — cada
# nome precisa de um registro DNS interno apontando pro servidor
# (192.168.62.194) e do Redirect URI https://<nome_dns>/api/auth/entra/callback
# no App Registration (o mesmo da Central).
# porta_https: endereço antigo https://192.168.62.194:<porta_https>, mantido
# só pra redirecionar pro nome DNS (favoritos antigos continuam funcionando).
#
# slug|nome|porta|porta_https|usuario|minuto_backup|nome_dns
logistica|Estoque Logística|3001|8443|estoque-log|15|estoque-logistica.telehelp.local
reversa|Estoque Reversa|3002|8444|estoque-reversa|20|estoque-reversa.telehelp.local
dimps|Estoque Dimps|3003|8445|estoque-dimps|25|estoque-dimps.telehelp.local
atop|Estoque ATOP|3004|8446|estoque-atop|30|estoque-atop.telehelp.local
